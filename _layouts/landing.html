<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Emrgi</title>

  <!-- SEO + Meta -->
  <meta name="description" content="Emrgi is a nonprofit cooperative working to make clean energy affordable and accessible to everyone, especially communities most burdened by energy costs.">
  <meta name="author" content="Emrgi">
  <meta property="og:title" content="{{ page.title }} | Emrgi">
  <meta property="og:description" content="Empowering households through clean energy access and equity. Join the cooperative powering a just energy transition.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
  <script>
  document.querySelector('.menu-toggle').addEventListener('click', function () {
    document.querySelector('.nav-links').classList.toggle('show');
  });
</script>
<body>
  <!-- Navigation -->
<nav class="main-nav">
  <div class="nav-container">
    <a href="#top" class="nav-logo">Emrgi</a>
    <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
    <div class="nav-links">
      <a href="#mission">Mission</a>
      <a href="#cooperative">Cooperative</a>
      <a href="#relief">Relief</a>
      <a href="#partners">Partners</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>


  <!-- Header / Hero -->
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <a href="https://emrgi.com/enroll" class="button">Join Now</a>
  </header>

  <!-- Main Content -->
  <main class="content">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    &copy; {{ site.time | date: '%Y' }} Emergi Foundation. All rights reserved.
    <div class="footer-links">
      <a href="/privacy">Privacy</a> |
      <a href="/terms">Terms</a> |
      <a href="/contact">Contact</a>
    </div>
  </footer>
</body>
</html>
